  <text x="364" y="205" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#9db9d8">A language that talks straight to the CPU. Built on a phone, in itself.</text>
  <text x="364" y="252" font-family="monospace" font-size="22" fill="#5f7ea3">source &#8594; own assembler &#8594; ELF &#183; no LLVM &#183; no GCC &#183; no ld</text>
